name: Estudio PC (.exe)

on:
  push:
    branches: [main, estudio-pc]
    paths: ["estudio/**", "pipeline/pipeline_fotos.py", ".github/workflows/estudio-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estudio-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: "0.1.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: estudio/empaque/requisitos-exe.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r estudio/empaque/requisitos-exe.txt pytest

      - name: Pruebas
        working-directory: estudio
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Ícono
        run: python estudio/empaque/icono.py

      - name: Armar programa (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build estudio/empaque/estudio.spec

      - name: Probar el programa armado
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\FOTOS JEFFERSON Estudio\FOTOS JEFFERSON Estudio.exe" `
               -ArgumentList '--autoprueba', "$env:RUNNER_TEMP\autoprueba.json" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP\autoprueba.json"
          if ($p.ExitCode -ne 0) { throw "La prueba del .exe falló (código $($p.ExitCode))" }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$env:VERSION" estudio\empaque\instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: FOTOS-JEFFERSON-Estudio-Setup
          path: dist/FOTOS-JEFFERSON-Estudio-Setup-*.exe
          retention-days: 30

      - name: Publicar descarga
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "estudio-v$env:VERSION"
          $exe = (Get-ChildItem dist\FOTOS-JEFFERSON-Estudio-Setup-*.exe).FullName
          gh release create $tag $exe --target $env:GITHUB_SHA --prerelease `
            --title "FOTOS JEFFERSON Estudio $env:VERSION" `
            --notes "Instalador del programa de PC. Descarga el .exe, ábrelo y sigue los pasos."
